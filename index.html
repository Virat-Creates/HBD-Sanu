<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Priyansha 💖</title>

<style>

/* ===== Romantic Animated Background ===== */
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1, #ee9ca7);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  text-align: center;
  color: white;
  overflow-x: hidden;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== Container ===== */
.container {
  padding: 30px;
}

/* ===== Glowing Heading ===== */
h1 {
  font-size: 50px;
  text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff69b4; }
  to { text-shadow: 0 0 30px #ff1493; }
}

/* ===== Typing Effect ===== */
.typing {
  font-size: 22px;
  margin: 20px auto;
  width: 80%;
  border-right: 3px solid white;
  white-space: nowrap;
  overflow: hidden;
  animation: typing 6s steps(60), blink 0.8s infinite;
}

@keyframes typing {
  from { width: 0 }
  to { width: 80% }
}

@keyframes blink {
  50% { border-color: transparent }
}

/* ===== Hanging Photo Gallery ===== */
.gallery {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.photo-frame {
  position: relative;
  padding: 10px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  animation: floatPhoto 4s ease-in-out infinite;
  transition: transform 0.4s ease;
}

.photo-frame:hover {
  transform: scale(1.1) rotate(2deg);
}

.photo-frame img {
  width: 220px;
  border-radius: 15px;
}

/* Hanging string */
.photo-frame::before {
  content: "";
  position: absolute;
  width: 3px;
  height: 40px;
  background: white;
  top: -40px;
  left: 50%;
}

@keyframes floatPhoto {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}

/* ===== Buttons ===== */
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: #ff1493;
  color: white;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: 0.3s;
}

button:hover {
  background: #ff69b4;
  transform: scale(1.05);
}

/* ===== Floating Hearts ===== */
.heart {
  position: fixed;
  bottom: -20px;
  color: pink;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

</style>
</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday Priyansha 🎂💖</h1>

<div class="typing">
You are the most beautiful blessing in my life.  
Thank you for always being there.  
You make everything brighter just by existing 💕
</div>

<!-- Romantic Hanging Photos -->
<div class="gallery">
  <div class="photo-frame">
    <img src="FB_IMG_1771112082610.jpg">
  </div>
  <div class="photo-frame">
    <img src="FB_IMG_1771112114976.jpg">
  </div>
  <div class="photo-frame">
    <img src="FB_IMG_1771112186468.jpg">
  </div>
</div>

<br>

<button id="playBtn">🎵 Play Birthday Song</button>

<audio id="music">
<source src="happy-birthday-song.mp3" type="audio/mpeg">
</audio>

<br>

<button onclick="showLove()">🎁 Click for Surprise</button>

</div>

<script>

/* Music */
const btn = document.getElementById("playBtn");
const music = document.getElementById("music");

btn.addEventListener("click", function () {
  music.play();
  btn.innerText = "🎶 Playing...";
});

/* Surprise */
function showLove(){
  alert("You are my most precious person 💖🎂 I wish you endless happiness!");
}

/* Floating Hearts Generator */
setInterval(() => {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);

}, 300);

</script>

</body>
</html>
