<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sanu 🎂</title>

<style>

body{
margin:0;
font-family:'Comic Sans MS', cursive;
background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#ffdde1,#ee9ca7);
background-size:400% 400%;
animation:bg 10s ease infinite;
text-align:center;
overflow-x:hidden;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
font-size:55px;
margin-top:30px;
text-shadow:0 0 15px #ff1493;
}

/* diary */

.diary{
background:white;
color:#333;
width:85%;
max-width:700px;
margin:auto;
padding:25px;
border-radius:15px;
line-height:1.6;
text-align:left;
box-shadow:0 10px 25px rgba(0,0,0,.4);
background-image:repeating-linear-gradient(
white,
white 28px,
#f2f2f2 29px
);
border-left:6px solid #ff69b4;
}

/* gift */

.gift{
width:120px;
height:120px;
background:#ff1493;
margin:30px auto;
border-radius:10px;
position:relative;
cursor:pointer;
transition:.5s;
}

.gift:before{
content:"";
position:absolute;
width:120px;
height:20px;
background:gold;
top:50px;
}

.gift:after{
content:"🎁";
position:absolute;
font-size:45px;
top:30px;
left:38px;
}

.gift.open{
transform:scale(1.2) rotate(10deg);
background:#ff69b4;
}

/* cake */

.cake{
margin:40px auto;
width:150px;
height:80px;
background:#ff69b4;
border-radius:10px;
position:relative;
}

.candle{
position:absolute;
top:-25px;
left:50%;
transform:translateX(-50%);
width:10px;
height:25px;
background:white;
}

.flame{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
width:10px;
height:10px;
background:orange;
border-radius:50%;
animation:flicker .2s infinite alternate;
}

@keyframes flicker{
from{opacity:.6}
to{opacity:1}
}

/* buttons */

button{
margin:15px;
padding:12px 25px;
border:none;
border-radius:10px;
font-size:16px;
background:#ff1493;
color:white;
cursor:pointer;
}

button:hover{
background:#ff69b4;
}

/* hearts */

.heart{
position:fixed;
bottom:-20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-100vh)}
}

/* photo gallery */

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
margin-top:40px;
}

.photo{
background:white;
padding:12px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.4);
transition:.3s;
}

.photo:hover{
transform:scale(1.08) rotate(2deg);
}

.photo img{
width:220px;
border-radius:10px;
}

/* popup */

#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:pink;
color:white;
padding:30px;
border-radius:20px;
transition:.3s;
max-width:320px;
}

#popup.show{
transform:translate(-50%,-50%) scale(1);
}

</style>
</head>

<body>

<h1>🎉 Happy Birthday Sanu 🎂💖</h1>

<div class="diary" id="typing"></div>

<div class="gift" onclick="openGift()"></div>

<div class="cake">
<div class="candle">
<div class="flame" id="flame"></div>
</div>
</div>

<button onclick="blowCandle()">🎂 Blow Candle</button>
<button onclick="playMusic()">🎵 Play Birthday Song</button>
<button onclick="openNote()">💌 Secret Note</button>

<audio id="music">
<source src="happy-birthday-song.mp3" type="audio/mpeg">
</audio>

<div id="popup">

💌 Secret Birthday Note

Dear Sanu,

You bring kindness and happiness wherever you go.  
Your friendship is something I truly appreciate.

May your birthday be filled with joy, success, laughter, and beautiful memories.

Happy Birthday once again 🎂✨

<br><br>
<button onclick="closePopup()">Close</button>

</div>

<div class="gallery">

<div class="photo">
<img src="photo1.jpg">
</div>

<div class="photo">
<img src="photo2.jpg">
</div>

<div class="photo">
<img src="photo3.jpg">
</div>

</div>

<script>

/* typing diary */

const text=`📖 Dear Diary,

Today is a very special day.

Dear Sanu,

Even though we met through screens, the bond we created feels warm and special.

You bring positivity and kindness.

I wish you happiness, success, and beautiful memories.

Happy Birthday 🎂💖
`

let i=0

function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i)
i++
setTimeout(type,25)
}
}

type()

/* gift opening */

function openGift(){

document.querySelector(".gift").classList.add("open")

launchConfetti()

launchBalloons()

}

/* confetti */

function launchConfetti(){

for(let i=0;i<80;i++){

let conf=document.createElement("div")

conf.style.position="fixed"

conf.style.width="8px"

conf.style.height="8px"

conf.style.background=`hsl(${Math.random()*360},100%,60%)`

conf.style.left=Math.random()*100+"vw"

conf.style.top="-10px"

document.body.appendChild(conf)

conf.animate([
{transform:"translateY(0)"},
{transform:"translateY(100vh)"}
],{duration:3000})

setTimeout(()=>conf.remove(),3000)

}

}

/* balloons */

function launchBalloons(){

for(let i=0;i<12;i++){

let balloon=document.createElement("div")

balloon.innerHTML="🎈"

balloon.style.position="fixed"

balloon.style.left=Math.random()*100+"vw"

balloon.style.bottom="-40px"

balloon.style.fontSize="30px"

document.body.appendChild(balloon)

balloon.animate([
{transform:"translateY(0)"},
{transform:"translateY(-120vh)"}
],{duration:5000})

setTimeout(()=>balloon.remove(),5000)

}

}

/* candle */

function blowCandle(){
document.getElementById("flame").style.display="none"
}

/* music */

function playMusic(){
document.getElementById("music").play()
}

/* popup */

function openNote(){
document.getElementById("popup").classList.add("show")
}

function closePopup(){
document.getElementById("popup").classList.remove("show")
}

/* floating hearts */

setInterval(()=>{
let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="💖"
heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(15+Math.random()*20)+"px"
document.body.appendChild(heart)
setTimeout(()=>heart.remove(),6000)
},300)

</script>

</body>
</html>
